services:
  # ============================================================
  # Database (PostgreSQL)
  # ============================================================
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: soundbin-db
    # NOTE: these credentials are hardcoded for local development only.
    # Do not reuse "soundbin_dev" as a password outside of a local dev setup;
    # a real deployment should pull these from a secrets manager or a
    # non-committed .env file instead of the compose file itself.
    environment:
      POSTGRES_USER: soundbin
      POSTGRES_PASSWORD: soundbin_dev
      POSTGRES_DB: soundbin
    ports:
      - "5433:5432"
    volumes:
      # Named Docker volume (below, under top-level `volumes:`) — data persists
      # across `docker compose down` but lives inside Docker's storage, not a
      # folder you can browse directly. Used for local development.
      # - postgresql:/var/lib/postgresql/data
      # Alternative: bind-mount to a host folder instead of a named volume,
      # so the raw Postgres data files are visible/backed-up on the host.
      # Swap to this (and remove the line above) for a non-dev deployment.
      - ./data/db-data:/var/lib/postgresql/data
    # Waits for Postgres to accept connections before starting the backend
    # (see `depends_on: condition: service_healthy` below). Without this,
    # the backend can start and try to migrate/connect before the DB is ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundbin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend (API)
  # ============================================================
  backend:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soundbin-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    environment:
      DATABASE_URL: "postgresql://soundbin:soundbin_dev@db:5432/soundbin?schema=public"
      PORT: ${BACKEND_PORT:-3000}
      # Browser origins allowed to call the API. Overrides backend/.env.
      FRONTEND_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}"
      # File-watching (used for the library watcher and dev hot-reload) can
      # silently fail to detect changes to files mounted into a Docker
      # container on some host filesystems. Polling forces Node to actively
      # check for changes instead of relying on native filesystem events.
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 100
    command: sh -c "npx prisma migrate deploy && npm run dev" 
    # runs migration as part of the containers startup command
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads

  # ============================================================
  # Frontend (Web App)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soundbin-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Read by vite.config.ts for the dev server port.
      PORT: ${FRONTEND_PORT:-5173}
      # Baked into the browser bundle as the API location. Must be reachable
      # from the *browser*, so localhost (the host machine), not "backend".
      BACKEND_URL: "http://backend:${BACKEND_PORT:-3000}"
    command: npm run dev -- --host


# Declares the named volume referenced by the db service above.
# This is a dev convenience so `docker compose down` doesn't wipe the
# database on every restart. For a real deployment, remove this and use
# the host bind-mount option instead (see the commented-out line under
# the db service's volumes:) so the data lives in a known, backed-up folder.
volumes:
  postgresql: